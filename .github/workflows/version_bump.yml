name: Version Bump

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  version:
    runs-on: ubuntu-latest
    if: "!startsWith(github.event.head_commit.message, '[RELEASE]') && !contains(github.event.head_commit.message, 'skip-release')"
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.PACKAGES_AUTH_TOKEN }}
          fetch-depth: 2

      - name: Check if a release is needed
        id: check
        run: |
          # Docs, legal, and CI-process files never change the deployed site.
          # If every file in this push matches, skip the version bump
          # automatically (same effect as a manual `skip-release`).
          if git diff --name-only HEAD~1 HEAD | grep -qvE '(\.md$|^LICENSE$|^\.github/)'; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
            echo "Release-worthy changes detected."
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "Docs/meta-only push. Skipping release automatically."
          fi

      - name: Determine bump type
        if: steps.check.outputs.needed == 'true'
        run: |
          if [[ "${{ github.event.head_commit.message }}" == feat:* ]]; then
            echo "newversion=minor" >> $GITHUB_ENV
          else
            echo "newversion=patch" >> $GITHUB_ENV
          fi

      - run: git config --global user.name "${GITHUB_ACTOR}"
        if: steps.check.outputs.needed == 'true'
      - run: git config --global user.email "${GITHUB_ACTOR}@users.noreply.github.com"
        if: steps.check.outputs.needed == 'true'
      - run: npm version ${{ env.newversion }} -m "[RELEASE] %s"
        if: steps.check.outputs.needed == 'true'
      - run: git push --follow-tags
        if: steps.check.outputs.needed == 'true'
